<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oche</title>
<meta name="description" content="Darts zählen, gegen Bots spielen und trainieren.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oche">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
/* Layout: iOS app shell. Content layer = inset grouped lists and score cards on the grouped background.
   Function layer (the only place for glass) = floating tab bar / sidebar, bar buttons, sheets, banners. */
:root {
  --bg: #f2f2f7;
  --cell: #ffffff;
  --label: #000000;
  --label-2: rgba(60, 60, 67, .74);
  --label-3: rgba(60, 60, 67, .34);
  --sep: rgba(60, 60, 67, .24);
  --fill: rgba(120, 120, 128, .2);
  --fill-2: rgba(120, 120, 128, .14);
  --fill-3: rgba(118, 118, 128, .1);
  --key: #ffffff;
  --key-down: #dcdce1;
  --thumb: #ffffff;
  --accent: #0066cc;
  --accent-fill: #0066cc;
  --on-accent: #ffffff;
  --red: #d70015;
  --glass: rgba(250, 250, 252, .64);
  --glass-solid: #f7f7f9;
  --glass-edge: rgba(255, 255, 255, .8);
  --glass-hi: rgba(255, 255, 255, .55);
  --glass-shadow: 0 8px 28px rgba(0, 0, 0, .1), 0 1px 3px rgba(0, 0, 0, .07);
  --scrim: rgba(0, 0, 0, .2);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --r-group: 24px;
  --r-key: 14px;
  --spring: cubic-bezier(.2, .9, .3, 1.04);
  accent-color: var(--accent);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --cell: #1c1c1e;
    --label: #ffffff; --label-2: rgba(235, 235, 245, .66); --label-3: rgba(235, 235, 245, .32); --sep: rgba(84, 84, 88, .7);
    --fill: rgba(120, 120, 128, .36); --fill-2: rgba(120, 120, 128, .28); --fill-3: rgba(118, 118, 128, .2);
    --key: #2c2c2e; --key-down: #48484a; --thumb: #636366;
    --accent: #0a84ff; --accent-fill: #0a6fdb; --red: #ff453a;
    --glass: rgba(38, 38, 42, .58); --glass-solid: #1f1f22; --glass-edge: rgba(255, 255, 255, .16); --glass-hi: rgba(255, 255, 255, .12);
    --glass-shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1c1c1e;
  --label: #ffffff; --label-2: rgba(235, 235, 245, .66); --label-3: rgba(235, 235, 245, .32); --sep: rgba(84, 84, 88, .7);
  --fill: rgba(120, 120, 128, .36); --fill-2: rgba(120, 120, 128, .28); --fill-3: rgba(118, 118, 128, .2);
  --key: #2c2c2e; --key-down: #48484a; --thumb: #636366;
  --accent: #0a84ff; --accent-fill: #0a6fdb; --red: #ff453a;
  --glass: rgba(38, 38, 42, .58); --glass-solid: #1f1f22; --glass-edge: rgba(255, 255, 255, .16); --glass-hi: rgba(255, 255, 255, .12);
  --glass-shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .5);
  color-scheme: dark;
}
/* Increase Contrast */
@media (prefers-contrast: more) {
  :root { --label-2: rgba(60, 60, 67, .92); --sep: rgba(60, 60, 67, .5); --fill-3: rgba(118, 118, 128, .2); --glass: var(--glass-solid); }
  :root[data-theme="dark"] { --label-2: rgba(235, 235, 245, .86); --sep: rgba(235, 235, 245, .4); }
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --label-2: rgba(235, 235, 245, .86); --sep: rgba(235, 235, 245, .4); }
}
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, .063 2.4%, .247 5.2%, .53 8.8%, .771 12.6%, .902 15.8%, .985 19.4%, 1.028 23.4%, 1.04 27.6%, 1.033 33%, 1.011 43%, .999 56%, 1); }
}

/* Dynamic Type: on Apple devices the root size follows the user's text size setting. */
html {
  height: 100%;
  box-sizing: border-box;
  font-size: 106.25%;
  font: -apple-system-body;
  font-family: var(--font);
  background: var(--bg);
}
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--label);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
svg.i { width: 1.35em; height: 1.35em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Type ramp (iOS sizes at "Large", relative to the 17 pt body) */
.lt { font-size: 2rem; line-height: 1.2; font-weight: 700; letter-spacing: .01em; }
.t2 { font-size: 1.294rem; line-height: 1.25; font-weight: 700; }
.t3 { font-size: 1.176rem; line-height: 1.25; font-weight: 600; }
.sub { font-size: .882rem; }
.fn { font-size: .765rem; }
.dim { color: var(--label-2); }

/* ---------- App shell ---------- */
#app { height: 100%; position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.content {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 54px 124px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.content > .lt { margin-bottom: -12px; }

/* Glass: function layer only */
.glass {
  position: relative;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(1.8);
  backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: inset 0 0 0 .5px var(--glass-edge), inset 0 1px 0 var(--glass-hi), var(--glass-shadow);
}
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(120% 90% at var(--gx, 30%) -20%, var(--glass-hi), transparent 55%);
}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .glass::after { display: none; }
}
@media (prefers-contrast: more) {
  .glass { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 0 0 1px var(--sep), var(--glass-shadow); }
}

/* Top bar: transparent with a soft scroll edge; the inline title appears once the large title scrolls away */
.topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  min-height: 56px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.topbar::before {
  content: "";
  position: absolute;
  inset: 0 0 -20px;
  z-index: -1;
  background: linear-gradient(var(--bg) 35%, color-mix(in srgb, var(--bg) 0%, transparent));
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  -webkit-mask-image: linear-gradient(#000 55%, transparent);
  mask-image: linear-gradient(#000 55%, transparent);
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
}
.topbar.scrolled::before { opacity: 1; }
.tb-title { font-weight: 600; font-size: 1rem; text-align: center; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.topbar.scrolled .tb-title { opacity: 1; }
.tb-r { justify-self: end; display: flex; gap: 8px; }
.gbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--label); }
.gbtn svg.i { width: 22px; height: 22px; stroke-width: 2.1; }
.gcap { min-height: 44px; padding: 0 18px; border-radius: 22px; font-weight: 600; color: var(--accent); }
.gbtn, .gcap { transition: transform .3s var(--spring); }
.gbtn:active, .gcap:active { transform: scale(.92); }

/* Floating tab bar (iPhone); sidebar on wide screens (iPad, Mac) */
.tabbar {
  position: absolute;
  z-index: 6;
  left: max(max(16px, env(safe-area-inset-left, 0px)), calc(50% - 210px));
  bottom: 10px;
  width: min(420px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))));
  height: 64px;
  padding: 4px;
  border-radius: 32px;
  display: flex;
  overflow: hidden;
  transition: width .5s var(--spring), left .5s var(--spring);
  view-transition-name: tabbar;
}
.tab {
  flex: 1 0 0;
  min-width: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: 28px;
  color: var(--label);
  font-size: .647rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background-color .2s, color .2s, opacity .2s;
}
.tab svg.i { width: 26px; height: 26px; stroke-width: 1.8; }
.tab[aria-current="page"] { color: var(--accent); background: var(--fill-3); }
.tabbar.compact { width: 64px; left: max(16px, env(safe-area-inset-left, 0px)); }
.tabbar.compact .tab:not([aria-current="page"]) { flex: 0 0 0; min-width: 0; opacity: 0; pointer-events: none; }
.tabbar.compact .tab span { display: none; }
@media (min-width: 900px) {
  .tabbar, .tabbar.compact {
    left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; bottom: 10px;
    width: 250px; height: auto;
    flex-direction: column; gap: 2px; padding: 12px 8px;
    border-radius: 28px;
  }
  .tabbar .tab, .tabbar.compact .tab:not([aria-current="page"]) {
    flex: none; flex-direction: row; justify-content: flex-start; gap: 12px;
    min-height: 44px; padding: 0 14px; border-radius: 22px;
    font-size: 1rem; font-weight: 500; opacity: 1; pointer-events: auto;
  }
  .tabbar.compact .tab span { display: inline; }
  .tabbar .tab svg.i { width: 22px; height: 22px; }
  .tabbar .tab[aria-current="page"] { font-weight: 600; }
  .with-side .content { padding-left: 290px; max-width: 1000px; }
  .with-side .topbar { padding-left: 290px; }
}

/* ---------- Content: cards and inset grouped lists ---------- */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-title { font-size: 1.294rem; font-weight: 700; }
.group { display: flex; flex-direction: column; gap: 7px; }
.group-h { font-size: .882rem; font-weight: 600; color: var(--label-2); padding: 0 16px; }
.group-f { font-size: .765rem; line-height: 1.35; color: var(--label-2); padding: 0 16px; }
.cells { background: var(--cell); border-radius: var(--r-group); overflow: hidden; }
.cell {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  width: 100%;
  min-height: 48px;
  padding: 10px 16px;
  text-align: left;
}
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
.cells.icons .cell + .cell::before { left: 58px; }
button.cell { transition: background-color .15s; }
button.cell:active { background: var(--fill-2); }
.cell-icon { width: 30px; display: grid; place-items: center; color: var(--accent); }
.cell-icon svg.i { width: 26px; height: 26px; }
.cell-main { flex: 1 1 9em; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.cell-t { font-size: 1rem; }
.cell-s { font-size: .882rem; color: var(--label-2); }
.cell-v { margin-left: auto; color: var(--label-2); text-align: right; font-variant-numeric: tabular-nums; font-size: .882rem; }
.cell-v b { display: block; color: var(--label); font-weight: 600; font-size: 1rem; }
.chev { color: var(--label-3); display: grid; place-items: center; }
.chev svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.cell.act { color: var(--accent); }
.cell.full > * { flex: 1 1 100%; }
.card { background: var(--cell); border-radius: var(--r-group); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card .row { display: flex; flex-wrap: wrap; gap: 10px; }
.card .row > * { flex: 1 1 9em; }
.intro { font-size: 1rem; line-height: 1.45; max-width: 62ch; }
.intro b { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 32px; padding: 6px 12px; border-radius: 16px; background: var(--fill-3); font-weight: 600; font-size: .882rem; display: inline-flex; align-items: center; }

/* Buttons */
.btn {
  min-height: 50px;
  padding: 12px 22px;
  border-radius: 25px;
  font-weight: 600;
  font-size: 1rem;
  text-align: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--fill-2);
  color: var(--accent);
  transition: transform .3s var(--spring), filter .2s;
}
.btn:active { transform: scale(.97); filter: brightness(.92); }
.btn.fill { background: var(--accent-fill); color: var(--on-accent); }
.btn.destr { color: var(--red); }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: .882rem; }

/* Segmented control */
.segc {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  min-height: 44px;
  padding: 2px;
  border-radius: 22px;
  background: var(--fill-3);
  width: 100%;
}
.segc::before {
  content: "";
  position: absolute;
  top: 2px; bottom: 2px;
  left: calc(2px + (100% - 4px) / var(--n) * var(--i));
  width: calc((100% - 4px) / var(--n));
  border-radius: 20px;
  background: var(--thumb);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
  transition: left .45s var(--spring);
}
.segc button { position: relative; z-index: 1; min-height: 40px; padding: 4px 6px; font-size: .882rem; font-weight: 500; border-radius: 20px; overflow-wrap: anywhere; }
.segc button[aria-pressed="true"] { font-weight: 600; }

/* Stepper, pop-up button, text field, switch */
.stepper { display: inline-flex; align-items: center; border-radius: 22px; background: var(--fill-3); flex: none; }
.stepper button { width: 50px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--label); }
.stepper button:active { background: var(--fill-2); }
.stepper i { width: .5px; height: 20px; background: var(--sep); }
.stepper svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
.stepv { min-width: 2ch; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.popup { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 10px; border-radius: 22px; color: var(--accent); font-weight: 500; margin-left: auto; }
.popup svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
.popup select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.popup:active { background: var(--fill-3); }
.tf { flex: 1 1 8em; min-width: 0; min-height: 44px; padding: 0 2px; border: 0; background: none; font-size: max(16px, 1rem); }
.tf::placeholder { color: var(--label-3); }
.tf:focus { outline: none; }
.cell:has(.tf:focus) { box-shadow: inset 0 0 0 2px var(--accent); border-radius: var(--r-group); }
input.switch { width: 51px; height: 31px; margin: 0 0 0 auto; flex: none; cursor: pointer; }
.noswitch input.switch {
  -webkit-appearance: none; appearance: none;
  position: relative; border-radius: 16px; background: var(--fill); transition: background-color .25s;
}
.noswitch input.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16);
  transition: transform .35s var(--spring);
}
.noswitch input.switch:checked { background: var(--accent-fill); }
.noswitch input.switch:checked::after { transform: translateX(20px); }
.pnum { width: 24px; text-align: center; color: var(--label-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.ibtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--accent); flex: none; }
.ibtn.destr { color: var(--red); }
.ibtn:active { background: var(--fill-3); }
.ibtn svg.i { width: 22px; height: 22px; }
.prow2 { flex: 1 1 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding-left: 36px; }

/* Bottom primary action */
.cta {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 12px;
  background: linear-gradient(color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 45%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.cta .btn { width: 100%; max-width: 480px; }
.cta .fn { text-align: center; color: var(--label-2); }

/* ---------- Play screens ---------- */
.play { background: var(--bg); overflow-y: auto; }
.pbar {
  flex: none;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px 4px;
}
.pbar-t { text-align: center; min-width: 0; }
.pbar-t b { display: block; font-weight: 600; font-size: 1rem; }
.pbar-t span { display: block; font-size: .765rem; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmain {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px 10px;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}
.stage { flex: 1; min-height: 130px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; container-type: size; }
.cards { flex: 1 1 auto; min-height: 0; display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.pc { display: flex; flex-direction: column; min-width: 0; padding: 12px 14px; border-radius: 22px; background: var(--cell); transition: box-shadow .35s var(--spring); }
.pc.on { box-shadow: inset 0 0 0 2.5px var(--accent); }
.pc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; min-width: 0; }
.pc-name { font-weight: 600; font-size: .882rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-name small { display: block; font-weight: 400; font-size: .765rem; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; }
.onbadge { flex: none; padding: 3px 8px; border-radius: 10px; background: var(--accent-fill); color: var(--on-accent); font-size: .706rem; font-weight: 600; }
.pc-sets { font-size: .765rem; color: var(--label-2); font-variant-numeric: tabular-nums; margin-top: 2px; }
.pc-sets b { color: var(--label); font-weight: 600; }
.pc-rem { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; font-size: clamp(48px, min(22vw, 22cqh), 124px); line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
.n1 .pc-rem { font-size: clamp(64px, min(30vw, 28cqh), 150px); }
.n3 .pc-rem, .n4 .pc-rem { font-size: clamp(36px, min(12vw, 10cqh), 64px); }
.pc-meta { display: flex; justify-content: space-between; gap: 6px; font-size: .765rem; color: var(--label-2); font-variant-numeric: tabular-nums; }

.strip { flex: none; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.strip span { min-height: 26px; border-radius: 8px; background: var(--fill-3); display: grid; place-items: center; font-size: .706rem; font-weight: 600; color: var(--label-2); font-variant-numeric: tabular-nums; }
.strip span.p { background: var(--accent-fill); color: var(--on-accent); }
.strip span.n { background: var(--fill); color: var(--label); text-decoration: line-through; }
.strip span.c { box-shadow: inset 0 0 0 2px var(--accent); color: var(--label); }

.stage > .slots { flex: none; }

.bars { flex: none; display: flex; align-items: flex-end; gap: 3px; height: 96px; padding: 10px 12px 0; background: var(--cell); border-radius: 18px; }

/* ---------- Summary & statistics ---------- */
.hero { display: flex; flex-direction: column; gap: 6px; }
.hero .score { font-family: var(--font-num); font-weight: 700; font-size: 3.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.badge { align-self: flex-start; padding: 5px 12px; border-radius: 14px; background: var(--accent-fill); color: var(--on-accent); font-weight: 600; font-size: .765rem; }

.actions { display: flex; flex-direction: column; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.tile span { font-size: .765rem; color: var(--label-2); }

.chart-card { background: var(--cell); border-radius: var(--r-group); padding: 14px 10px 8px; position: relative; }

.chart .grid { stroke: var(--sep); stroke-width: 1; }

.chart .ar { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--accent); stroke: var(--cell); stroke-width: 2; }

.tip { position: absolute; top: 4px; pointer-events: none; padding: 6px 10px; border-radius: 12px; font-size: .706rem; color: var(--label-2); white-space: nowrap; transform: translateX(-50%); }

/* ---------- Sheets & banner (function layer) ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .25s ease-out; }
.sheet {
  position: relative;
  width: calc(100% - 16px);
  max-width: 440px;
  margin-bottom: 8px;
  padding: 10px 14px 14px;
  border-radius: 38px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: sheet-in .5s var(--spring);
}
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 0 auto 4px; }

.sheet .btn { width: 100%; border-radius: 24px; min-height: 50px; }
.sheet textarea.code { width: 100%; height: 110px; resize: none; padding: 10px 12px; border: 0; border-radius: 16px; background: var(--fill-3); color: var(--label); font: 13px/1.35 ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; }

.sheet-acts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.sheet-acts.row { flex-direction: row; }
.sheet-acts.row .btn { flex: 1; }
@keyframes sheet-in { from { transform: translateY(110%); } }
@keyframes fade { from { opacity: 0; } }
.banner {
  position: fixed;
  z-index: 40;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  max-width: calc(100% - 32px);
  min-height: 44px;
  padding: 10px 18px 10px 14px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: .882rem;
  color: var(--label);
  pointer-events: none;
  transform: translateX(-50%);
  animation: banner-in .5s var(--spring);
}
.banner svg.i { width: 20px; height: 20px; }
.banner.good svg.i { color: var(--accent); }
.banner.bad svg.i { color: var(--red); }
@keyframes banner-in { from { transform: translate(-50%, -16px) scale(.92); opacity: 0; } }

/* Navigation transitions (View Transitions API): push/pop slide, full-screen covers rise from the bottom */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .42s; animation-timing-function: var(--spring); }
html[data-nav="push"]::view-transition-old(root) { animation-name: vt-out-left; }
html[data-nav="push"]::view-transition-new(root) { animation-name: vt-in-right; }
html[data-nav="pop"]::view-transition-old(root) { animation-name: vt-out-right; z-index: 2; }
html[data-nav="pop"]::view-transition-new(root) { animation-name: vt-in-left; }
html[data-nav="up"]::view-transition-new(root) { animation-name: vt-in-up; }
html[data-nav="up"]::view-transition-old(root) { animation-name: vt-hold; }
html[data-nav="down"]::view-transition-old(root) { animation-name: vt-out-down; z-index: 2; }
html[data-nav="down"]::view-transition-new(root) { animation-name: vt-hold; }
@keyframes vt-in-right { from { transform: translateX(100%); } }
@keyframes vt-out-left { to { transform: translateX(-30%); opacity: .6; } }
@keyframes vt-in-left { from { transform: translateX(-30%); opacity: .6; } }
@keyframes vt-out-right { to { transform: translateX(100%); } }
@keyframes vt-in-up { from { transform: translateY(100%); } }
@keyframes vt-out-down { to { transform: translateY(100%); } }
@keyframes vt-hold { from { opacity: 1; } to { opacity: 1; } }

@media (max-height: 700px) {
  .key { min-height: 46px; }
  .k5 .key { min-height: 40px; }
  .bigbtn { min-height: 62px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  ::view-transition-old(root) { animation-name: fade-out-x !important; animation-duration: .25s !important; animation-timing-function: ease !important; }
  ::view-transition-new(root) { animation-name: fade-x !important; animation-duration: .25s !important; animation-timing-function: ease !important; }
}
@keyframes fade-x { from { opacity: 0; } }
@keyframes fade-out-x { to { opacity: 0; } }

<body>
<div id="app"></div>
<script>
// ===== Board geometry (mm, regulation steel-tip board) =====
const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const R = { bullIn: 6.35, bullOut: 15.9, trebIn: 99, trebOut: 107, dblIn: 162, dblOut: 170 };

function dart(n, m) { // n: 1..20 | 25 | 0 (miss), m: 1..3
  if (n === 0) return { n: 0, m: 0, v: 0 };
  return { n, m, v: n * m };
}
function dartLabel(d) {
  if (!d || d.n === 0) return '0';
  if (d.n === 25) return d.m === 2 ? 'Bull' : '25';
  return (d.m === 3 ? 'T' : d.m === 2 ? 'D' : 'S') + d.n;
}
function hitAt(x, y) { // y up
  const r = Math.hypot(x, y);
  if (r <= R.bullIn) return dart(25, 2);
  if (r <= R.bullOut) return dart(25, 1);
  if (r > R.dblOut) return dart(0, 0);
  const deg = Math.atan2(y, x) * 180 / Math.PI;
  const theta = ((90 - deg + 9) % 360 + 360) % 360;
  const n = ORDER[Math.floor(theta / 18) % 20];
  const m = (r >= R.trebIn && r <= R.trebOut) ? 3 : (r >= R.dblIn) ? 2 : 1;
  return dart(n, m);
}
function aimPoint(d) {
  if (d.n === 25 || d.n === 0) return { x: 0, y: 0 };
  const idx = ORDER.indexOf(d.n);
  const a = (90 - idx * 18) * Math.PI / 180;
  const r = d.m === 3 ? 103 : d.m === 2 ? 166 : 134;
  return { x: r * Math.cos(a), y: r * Math.sin(a) };
}
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function throwAt(target, sigma) {
  const p = aimPoint(target);
  const x = p.x + gauss() * sigma, y = p.y + gauss() * sigma;
  return { x, y, hit: hitAt(x, y) };
}

// ===== Checkout routes =====
const ALL_DARTS = (() => {
  const a = [];
  for (let n = 1; n <= 20; n++) for (let m = 1; m <= 3; m++) a.push(dart(n, m));
  a.push(dart(25, 1), dart(25, 2));
  return a;
})();
const DOUBLE_PREF = { 16: 0, 20: .05, 8: .2, 10: .25, 12: .3, 18: .4, 4: .45, 14: .5, 6: .55, 2: .6, 19: .6, 17: .65, 9: .7, 13: .7, 15: .7, 11: .75, 7: .8, 5: .8, 3: .9, 1: 1.5 };
function setupCost(d) {
  if (d.n === 25) return d.m === 2 ? 1.2 : .9;
  if (d.m === 1) return .1 + (20 - d.n) * .002;
  if (d.m === 3) return d.n === 20 ? 0 : d.n === 19 ? .05 : d.n >= 17 ? .15 : d.n >= 15 ? .25 : d.n >= 10 ? .35 : .5;
  return .9; // doubles as setup darts
}
function finishCost(d, out) {
  if (d.n === 25 && d.m === 2) return 1.2;
  if (d.m === 2) return DOUBLE_PREF[d.n];
  if (out === 'single') return d.m === 1 ? .1 : d.m === 3 ? .4 : .6; // single out
  return .6 + setupCost(d); // master out treble
}
function isFinishDart(d, out) {
  if (out === 'single') return true;
  if (out === 'master') return d.m >= 2;
  return d.m === 2;
}
const routeMemo = new Map();
function bestRoute(r, dartsLeft, out = 'double') {
  if (r <= 0 || r > 180 || dartsLeft <= 0) return null;
  const key = r + '|' + dartsLeft + '|' + out;
  if (routeMemo.has(key)) return routeMemo.get(key);
  let best = null, bestCost = Infinity;
  const fins = ALL_DARTS.filter(d => isFinishDart(d, out));
  for (const f of fins) {
    const rest = r - f.v;
    if (rest < 0) continue;
    if (rest === 0) { const c = 1 + finishCost(f, out); if (c < bestCost) { bestCost = c; best = [f]; } continue; }

const histName = p => p.bot ? botLabel(p.bot) : p.name;
function lineChart(pts) {
  const W = 340, H = 170, L = 30, Rr = 36, T = 14, B = 24;
  const vs = pts.map(p => p.v);
  let lo = Math.floor(Math.min(...vs) / 10) * 10, hi = Math.ceil(Math.max(...vs) / 10) * 10;
  if (hi - lo < 20) { const m = (hi + lo) / 2; lo = Math.max(0, Math.floor((m - 10) / 10) * 10); hi = lo + 20; }
  const step = (hi - lo) <= 40 ? 10 : (hi - lo) <= 80 ? 20 : 30;
  const n = pts.length;
  const X = i => L + (n === 1 ? (W - L - Rr) / 2 : i * (W - L - Rr) / (n - 1));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = '';
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W - Rr + 6}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 6}" y="${Y(v)}" text-anchor="end" dominant-baseline="central">${v}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('');
  const area = n > 1 ? `<path class="ar" d="${line}L${X(n - 1).toFixed(1)} ${H - B}L${X(0).toFixed(1)} ${H - B}Z"/>` : '';
  const lx = X(n - 1), ly = Y(pts[n - 1].v);
  const xl = `<text class="axis" x="${X(0)}" y="${H - 6}" text-anchor="${n > 1 ? 'start' : 'middle'}">${esc(pts[0].d)}</text>${n > 1 ? `<text class="axis" x="${lx}" y="${H - 6}" text-anchor="end">${esc(pts[n - 1].d)}</text>` : ''}`;
  return `<div class="chart-card"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="3-Dart-Average je Spiel, zuletzt ${f1(pts[n - 1].v)}" data-n="${n}" data-l="${L}" data-r="${Rr}" data-w="${W}">
      ${g}${area}<path class="ln" d="${line}"/>
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
      <circle class="dot" cx="${lx}" cy="${ly}" r="4.5"/><text class="lab" x="${lx + 8}" y="${ly}" dominant-baseline="central">${f1(pts[n - 1].v)}</text>
      ${xl}<rect x="${L}" y="0" width="${W - L - Rr}" height="${H}" fill="transparent"/>
    </svg><div class="tip glass" hidden></div></div>`;
}
function bindChart() {
  const svgEl = $app.querySelector('.chart');
  if (!svgEl) return;
  const tip = svgEl.parentElement.querySelector('.tip'), xh = svgEl.querySelector('.xh');
  const n = +svgEl.dataset.n, L = +svgEl.dataset.l, Rr = +svgEl.dataset.r, W = +svgEl.dataset.w;
  const data = UI.chartData || [];
  const move = ev => {
    const r = svgEl.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
    const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((sx - L) / ((W - L - Rr) / (n - 1)))));
    const x = n === 1 ? L + (W - L - Rr) / 2 : L + i * (W - L - Rr) / (n - 1);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    const d = data[i];
    if (!d) return;
    tip.hidden = false;
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = 'Ø ' + f1(d.v);
    tip.append(b, document.createTextNode(d.d + ' · ' + d.vs));
    tip.style.left = Math.max(70, Math.min(r.width - 70, x / W * r.width + 10)) + 'px';
  };
  const leave = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); };
  svgEl.addEventListener('pointermove', move);
  svgEl.addEventListener('pointerdown', move);
  svgEl.addEventListener('pointerleave', leave);
}
function tabStats() {

  } else {

    const bestAvg = x.length ? Math.max(...x.map(r => r.p.avg)) : null;

    UI.chartData = series;
    main = `${names.length > 1 ? segc('data-a="sp"', names.slice(0, 4).map(n => [esc(n), esc(n)]), esc(me)) : ''}

  }

  const coBy = {};

  const hist = H.slice(0, 25).map(h => {

    if (GAME_KINDS.includes(h.kind)) {

// ================= Play =================
function vPlay() {
  const s = DB.current;
  if (!s) return vTabs();
  const V = { x01: vX01, cricket: vCricket, atw: vATW, bobs: vBobs, shanghai: vShanghai, halve: vHalve, c121: vAttempt, checkout: vAttempt, scoring: vScoring }[s.kind];

function vX01(s) {

  const ev = evalDarts(st.rem[st.turn], pend, out);
  const liveRem = ev.bust ? st.rem[st.turn] : ev.rem;
  const cards = s.players.map((p, i) => {
    const S = st.stats[i], on = i === st.turn, rem = on ? liveRem : st.rem[i];

      <ol class="pc-log" aria-label="Aufnahmen in diesem Leg">${st.log[i].slice(-12).reverse().map(e => `<li>${e.b ? '<span class="bust">Überworfen</span>' : `<b>${e.t}</b>`}<span>${e.r}</span></li>`).join('')}</ol>
    </div>`;
  }).join('');
  let pad;
  if (botTurn) pad = botPanel(s);
  else if (DB.settings.inputMode === 'darts') pad = dartPad({ list: pend, sum: pend.length ? pend.reduce((a, [nn, m]) => a + nn * m, 0) : null });
  else {
    const e = +UI.entry, rem = st.rem[st.turn];
    let hint = 'Punkte dieser Aufnahme', bad = false;
    if (UI.entry !== '') {
      if (!POSSIBLE_TOTALS.has(e)) { hint = 'Mit 3 Darts nicht möglich'; bad = true; }
      else if (e > rem || (out !== 'single' && rem - e === 1) || (e === rem && !minDartsToFinish(rem, out))) { hint = 'Überworfen'; bad = true; }

    }

  return `${pbar(`${s.cfg.start} · ${outLabel(out)}`, matchSub(s, st))}
    <div class="pmain">
      <div class="stage">
        <div class="cards n${n}" style="--cols:${n === 1 ? 1 : 2}">${cards}</div>
        ${coStrip(liveRem, Math.max(1, 3 - pend.length), out)}

}

function vSummary() {
  const s = DB.current;
  if (!s) return vTabs();
  const e = DB.history.find(h => h.id === s.id) || summarize(s);
  const rec = s.newRecord ? '<span class="badge">Neuer Bestwert</span>' : '';
  const prev = s.prevRecord;
  let title = '', hero = '', body = '';
  if (GAME_KINDS.includes(s.kind)) {
    const W = e.players[e.winner];
    title = `${histName(W)} gewinnt`;
    const main = s.cfg.sets ? e.players.map(p => p.sets).join(' : ') : e.players.map(p => p.legs).join(' : ');
    hero = `<div class="score">${main}</div><p class="dim">${s.cfg.sets ? `in Sets, Legs insgesamt ${e.players.map(p => p.legs).join(' : ')}` : 'in Legs'}<br>${s.kind === 'x01' ? `${s.cfg.start} ${outLabel(s.cfg.out)}` : 'Cricket'} · ${formatLabel(s.cfg)}</p>`;
    const rows = s.kind === 'x01' ? [
      ['3-Dart-Average', p => f1(p.avg), p => p.avg],
      ['First 9 Average', p => f1(p.f9), p => p.f9],
      ['Darts', p => p.darts],
      ['100+', p => p.t100], ['140+', p => p.t140], ['180', p => p.t180],
      ['Höchstes Finish', p => p.hi || '–', p => p.hi],
      ['Bestes Leg', p => p.best ? `${p.best} Darts` : '–'],
      ['Checkout-Quote', p => p.dA ? `${pct(p.dH, p.dA)}<small class="sub-v">${p.dH} von ${p.dA}</small>` : '–'],
    ] : [['Marks pro Runde', p => f1(p.mpr), p => p.mpr], ['Legs', p => p.legs]];
    body = `<div class="tbl"><table class="st"><thead><tr><th></th>${e.players.map(p => `<th>${esc(histName(p))}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(([l, f, g]) => { const mx = g ? Math.max(...e.players.map(g)) : null; return `<tr><td>${l}</td>${e.players.map(p => `<td class="${g && e.players.length > 1 && g(p) === mx && mx > 0 ? 'win' : ''}">${f(p)}</td>`).join('')}</tr>`; }).join('')}
      </tbody></table></div>${s.kind === 'x01' ? '<p class="group-f">Die Checkout-Quote zählt nur Aufnahmen, die Pfeil für Pfeil eingegeben wurden. ● markiert den besseren Wert.</p>' : ''}`;
  } else if (s.kind === 'atw') {
    title = `${e.darts} Darts`;
    hero = `<p class="dim">${atwName(s.cfg)} · ${e.hits} Treffer · Quote ${pct(e.hits, e.darts)}${prev !== null && !s.newRecord ? ` · Bestwert ${prev} Darts` : ''}</p>`;
  } else if (s.kind === 'bobs') {
    title = `${e.score} Punkte`;
    hero = `<p class="dim">${e.dead ? `Ausgeschieden bei ${BOBS_SEQ[e.reached - 1] === 25 ? 'Bull' : 'D' + BOBS_SEQ[e.reached - 1]}` : 'Alle 21 Runden geschafft'}${prev !== null && !s.newRecord ? ` · Bestwert ${prev}` : ''}</p>`;
  } else if (s.kind === 'shanghai') {
    title = e.shanghai ? 'Shanghai!' : `${e.score} Punkte`;
    hero = `<p class="dim">${e.shanghai ? `Gewonnen in Runde ${e.reached} mit ${e.score} Punkten` : `${s.cfg.rounds} Runden gespielt`}${prev !== null && !s.newRecord ? ` · Bestwert ${prev}` : ''}</p>`;
  } else if (s.kind === 'halve') {
    title = `${e.score} Punkte`;
    const st = hvState(s);
    hero = `<p class="dim">${st.log.filter(x => x === 0).length}× halbiert${prev !== null && !s.newRecord ? ` · Bestwert ${prev}` : ''}</p>`;
  } else if (s.kind === 'c121' || s.kind === 'checkout') {
    if (s.kind === 'c121') { title = e.best ? `Bis ${e.best}` : 'Kein Finish'; hero = `<p class="dim">${e.ok} von ${e.n} Versuchen gecheckt${prev !== null && !s.newRecord ? ` · Bestwert ${prev}` : ''}</p>`; }
    else { title = `${e.ok} von ${e.n}`; hero = `<p class="dim">Quote ${pct(e.ok, e.n)} · ${s.cfg.range.replace('-', '–')} · ${s.cfg.darts} Darts pro Versuch</p>`; }
    body = `<div class="tbl"><table class="st"><thead><tr><th>Rest</th><th>Weg</th><th>Ergebnis</th></tr></thead><tbody>${s.attempts.map(a => { const rt = bestRoute(a.t, 3, 'double'); return `<tr><td>${a.t}</td><td>${rt ? rt.darts.map(dartLabel).join(' ') : ''}</td><td>${a.ok ? 'gecheckt' : 'verfehlt'}</td></tr>`; }).join('')}</tbody></table></div>`;
  } else if (s.kind === 'scoring') {
    title = `Ø ${f1(e.avg)}`;
    hero = `<p class="dim">${e.total} Punkte in ${e.n} Aufnahmen · höchste ${e.hi}${prev !== null && !s.newRecord ? ` · Bestwert Ø ${f1(prev)}` : ''}</p>`;
  }
  const eyebrow = GAME_KINDS.includes(s.kind) ? 'Match beendet' : KIND_NAME[s.kind];
  return `<div class="view">
    <div class="topbar" id="topbar"><span></span><div class="tb-title">${esc(title)}</div><div class="tb-r"><button class="gcap glass" data-a="exit">Fertig</button></div></div>
    <div class="scroll" data-key="summary"><main class="content">
      <div class="hero"><span class="fn dim">${eyebrow}</span>${rec}<h1 class="lt">${esc(title)}</h1>${hero}</div>${body}
      <div class="actions"><button class="btn fill" data-a="again">${GAME_KINDS.includes(s.kind) ? 'Revanche spielen' : 'Noch einmal'}</button><button class="btn" data-a="undo">Letzte Eingabe zurücknehmen</button></div>
    </main></div>
  </div>`;
}

// ================= Sheets =================
function vSheet() {
  const m = UI.sheet;
  if (!m) return '';
  let inner = '';
  if (m.kind === 'co') {
    const opts = [1, 2, 3].filter(d => d >= m.min);
    inner = `<h2 id="sheet-t">Checkout ${m.total}</h2><p>Mit wie vielen Darts hast du gecheckt?</p>
      <div class="sheet-acts row">${opts.map(d => `<button class="btn fill" data-a="codarts" data-v="${d}">${plural(d, 'Dart', 'Darts')}</button>`).join('')}</div>
      <div class="sheet-acts"><button class="btn" data-a="sheetx">Abbrechen</button></div>`;
  } else if (m.kind === 'export') {
    inner = `<h2 id="sheet-t">Daten kopieren</h2><p>Kopiere diesen Code und füge ihn in der anderen App unter Statistik → Daten einfügen ein.</p>
      <textarea class="code" id="xfer" readonly aria-label="Übertragungscode">${esc(m.code)}</textarea>
      <div class="sheet-acts"><button class="btn fill" data-a="copyCode">Code kopieren</button><button class="btn" data-a="sheetx">Fertig</button></div>`;
  } else if (m.kind === 'import') {
    inner = `<h2 id="sheet-t">Daten einfügen</h2><p>Füge den Code aus der anderen App ein. Vorhandene Spiele bleiben erhalten.</p>
      <textarea class="code" id="xfer" placeholder="OCHE1.…" aria-label="Übertragungscode" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="sheet-acts"><button class="btn fill" data-a="importData">Daten übernehmen</button><button class="btn" data-a="sheetx">Abbrechen</button></div>`;
  } else if (m.kind === 'confirm') {
    inner = `<h2 id="sheet-t">${m.title}</h2><p>${m.text}</p>
      <div class="sheet-acts"><button class="btn destr" data-a="${m.a}">${m.action}</button><button class="btn" data-a="sheetx">Abbrechen</button></div>`;
  }
  return `<div class="sheet-wrap"><div class="scrim" data-a="sheetx"></div><div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="grabber"></div>${inner}</div></div>`;
}

// ================= Render & navigation =================
let wakeLock = null, wakeBusy = false;
async function wake(on) {
  try {
    if (on && !wakeLock && !wakeBusy && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeBusy = true;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeBusy = false;
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; wakeBusy = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && UI.view === 'play') wake(true); });
function setCompact(v) {
  if (UI.compact === v) return;
  UI.compact = v;
  const tb = $app.querySelector('.tabbar');
  if (tb) tb.classList.toggle('compact', v);
}
function bindScroll() {
  const sc = $app.querySelector('.scroll');
  if (!sc) return;
  const key = sc.dataset.key;
  if (UI.scroll[key]) sc.scrollTop = UI.scroll[key];
  const tb = document.getElementById('topbar');
  let last = sc.scrollTop;
  const upd = () => {
    const y = sc.scrollTop;
    UI.scroll[key] = y;
    if (tb) tb.classList.toggle('scrolled', y > 34);
    if (window.innerWidth < 900) {
      if (y > 90 && y - last > 4) setCompact(true);
      else if (last - y > 4 || y < 40) setCompact(false);
    }
    last = y;
  };
  sc.addEventListener('scroll', upd, { passive: true });
  upd();
}
function bindGlass() {
  const tb = $app.querySelector('.tabbar');
  if (!tb) return;
  tb.addEventListener('pointermove', e => { const r = tb.getBoundingClientRect(); tb.style.setProperty('--gx', Math.round((e.clientX - r.left) / r.width * 100) + '%'); });
}
function render() {
  const v = UI.view;
  const html = v === 'setup' ? vSetup() : v === 'play' ? vPlay() : v === 'summary' ? vSummary() : vTabs();
  $app.innerHTML = html + vSheet();
  bindScroll(); bindChart(); bindGlass();
  const focus = $app.querySelector('.sheet textarea:not([readonly])') || $app.querySelector('.sheet .btn');
  if (focus) focus.focus({ preventScroll: true });
  wake(v === 'play');
}
// Views morph into each other: push/pop slide sideways, full-screen games rise from the bottom.
function nav(fn, dir = 'fade') {
  const run = () => { fn(); render(); maybeBot(); };
  if (!document.startViewTransition || document.visibilityState !== 'visible') { run(); return; }
  document.documentElement.dataset.nav = reduceMotion() ? 'fade' : dir;
  try {
    const t = document.startViewTransition(run);
    t.finished.finally(() => { delete document.documentElement.dataset.nav; });
  } catch (e) { run(); }
}
function startSession(kind) {
  cancelBot();
  UI.entry = ''; UI.mod = 1; UI.sheet = null;
  nav(() => { DB.current = newSession(kind); UI.view = 'play'; save(); }, 'up');
}

// ================= Actions =================
let cfgTimer = null;
const ACT = {
  tab(v) {
    if (v === UI.tab) {
      if (UI.compact) setCompact(false);
      else { const sc = $app.querySelector('.scroll'); if (sc) sc.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); }
      return;
    }
    nav(() => { UI.tab = v; UI.compact = false; }, 'fade');
  },
  setup(v) { nav(() => { UI.setup = v; UI.view = 'setup'; UI.scroll['setup-' + v] = 0; }, 'push'); },
  back() { nav(() => { UI.view = 'tabs'; }, 'pop'); },
  cfg(v, el) {
    setCfg(el.dataset.k, v);
    save();
    const seg = el.parentElement, btns = [...seg.children];
    seg.style.setProperty('--i', btns.indexOf(el));
    btns.forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    clearTimeout(cfgTimer);
    cfgTimer = setTimeout(render, 380);
  },
  step(v, el) {
    const [a, b] = el.dataset.k.split('.');
    DB.settings[a][b] = Math.max(+el.dataset.min, Math.min(+el.dataset.max, DB.settings[a][b] + +v));
    save(); render();
  },
  botstep(v, el) {
    const p = DB.settings.players[+v];
    p.bot = Math.max(20, Math.min(110, botAvg(p.bot) + +el.dataset.d));
    save(); render();
  },
  padd(v) {
    const P = DB.settings.players;
    if (P.length >= 4) return;
    P.push(v === 'b' ? { bot: 45 } : { name: `Spieler ${P.filter(p => !p.bot).length + 1}` });
    save(); render();
    if (v !== 'b') { const inp = document.getElementById('pn' + (P.length - 1)); if (inp) { inp.focus(); inp.select(); } }
  },
  pdel(v) { DB.settings.players.splice(+v, 1); save(); render(); },
  pup(v) { const P = DB.settings.players, i = +v; [P[i - 1], P[i]] = [P[i], P[i - 1]]; save(); render(); },
  start(v) {
    if (GAME_KINDS.includes(v) && DB.settings.players.every(p => p.bot)) return;
    startSession(v);
  },
  quickbot() {
    const S = DB.settings;
    if (!S.players.some(p => !p.bot)) S.players.unshift({ name: 'Spieler 1' });
    if (!S.players.some(p => p.bot)) { if (S.players.length >= 4) S.players.length = 3; S.players.push({ bot: 45 }); }
    if (S.players.length > 4) S.players.length = 4;
    startSession('x01');
  },
  resume() { if (!DB.current) return; UI.entry = ''; nav(() => { UI.view = DB.current.finished ? 'summary' : 'play'; }, 'up'); },
  discardAsk() {
    if (DB.current && DB.current.finished) { ACT.discard(); return; }
    UI.sheet = { kind: 'confirm', title: 'Spiel beenden?', text: 'Das laufende Spiel wird verworfen und nicht in der Statistik gespeichert.', action: 'Spiel verwerfen', a: 'discard' };
    render();
  },
  discard() { cancelBot(); DB.current = null; UI.sheet = null; save(); render(); },
  wipeAsk() { UI.sheet = { kind: 'confirm', title: 'Statistik löschen?', text: 'Alle gespeicherten Spiele, Averages und Trainingsrekorde auf diesem Gerät werden gelöscht. Das lässt sich nicht rückgängig machen.', action: 'Alles löschen', a: 'wipe' }; render(); },
  wipe() { DB.history = []; UI.sheet = null; save(); render(); banner('Statistik gelöscht', 'good'); },
  sheetx() {
    const m = UI.sheet;
    UI.sheet = null;
    render();
    if (m && m.kind === 'co') maybeBot();
  },
  leave() { cancelBot(); nav(() => { UI.view = 'tabs'; UI.tab = 'play'; }, 'down'); },
  exit() { cancelBot(); nav(() => { DB.current = null; UI.view = 'tabs'; save(); }, 'down'); },
  undo() { undo(); },
  imode(v) { DB.settings.inputMode = v; UI.entry = ''; if (DB.current && DB.current.pending) DB.current.pending = []; save(); render(); },
  key(v) {
    const n = (UI.entry === '0' ? '' : UI.entry) + v;
    if (+n > 180 || n.length > 3) return;
    UI.entry = n;
    render();
  },
  keydel() { UI.entry = UI.entry.slice(0, -1); render(); },
  ok() { if (UI.entry === '') { banner('Tippe zuerst die Punkte ein, für eine Null die 0.'); return; } submitTotal(+UI.entry); },
  quick(v) { submitTotal(+v); },
  codarts(v) { const m = UI.sheet; UI.sheet = null; commitVisit({ p: m.p, total: m.total, darts: +v, bust: false }); },
  mod(v) { UI.mod = UI.mod === +v ? 1 : +v; render(); },
  pdel() {
    const s = DB.current;
    if (s.kind === 'checkout' || s.kind === 'c121') { undo(); return; }
    if (s.pending && s.pending.length) { s.pending.pop(); save(); render(); } else undo();
  },
  dart(v) {
    const s = DB.current;
    if (!s || UI.bot) return;
    let n = +v, m = UI.mod;
    if (n === 0) m = 0;
    else if (n === 50) { n = 25; m = 2; }
    else if (n === 25 && m === 3) return;
    if (s.kind === 'x01') x01Dart(n, m);
    else if (s.kind === 'cricket') cricketDart(n, m);
    else coDart(n, m);
  },
  ckrest() {
    const s = DB.current;
    while (s.pending.length < 3) s.pending.push([0, 0]);
    commitVisit({ p: cricketState(s).turn, list: s.pending.slice() });
  },
  botskip() {
    if (!UI.bot || !botStep) return;
    clearTimeout(botTimer);
    UI.bot.shown = UI.bot.throws.length;
    render();
    botTimer = setTimeout(botStep, 450);
  },
  atw(v) {
    const s = DB.current;
    s.throws.push(+v);
    if (atwState(s).done) { finishSession(); return; }
    save(); render();
  },
  bobs(v) {
    const s = DB.current;
    s.rounds.push(+v);
    if (bobsState(s).done) { finishSession(); return; }
    save(); render();
  },
  sh(v) {
    const s = DB.current;
    s.pending.push(+v);
    if (s.pending.length === 3) {
      s.rounds.push(s.pending); s.pending = [];
      const st = shState(s);
      if (st.shanghai) { banner('Shanghai!', 'good', 2200); haptic(); }
      if (st.done) { finishSession(); return; }
    }
    save(); render();
  },
  hv(v) {
    const s = DB.current, [n, m] = v.split(':').map(Number);
    s.pending.push([n, m]);
    if (s.pending.length === 3) {
      const t = HALVE_SEQ[hvState(s).i];
      const pts = s.pending.reduce((a, d) => a + hvPoints(t, d), 0);
      s.rounds.push(s.pending); s.pending = [];
      if (!pts) { banner('Kein Treffer: Stand halbiert', 'bad', 1600); haptic(); }
      if (hvState(s).done) { finishSession(); return; }
    }
    save(); render();
  },
  cogiveup() { coFinish(false); },
  again() {
    const s = DB.current;
    if (!s) return;
    nav(() => {
      if (GAME_KINDS.includes(s.kind)) {
        const players = s.players.slice(1).concat(s.players.slice(0, 1));
        DB.current = { ...newSession(s.kind), cfg: clone(s.cfg), players: clone(players) };
      } else {
        DB.current = { ...newSession(s.kind), cfg: clone(s.cfg) };
        if (s.kind === 'checkout') DB.current.cur = coNext(s.cfg, 0);
      }
      UI.view = 'play'; UI.entry = '';
      save();
    }, 'fade');
  },
  sp(v) { UI.statsPlayer = v; render(); },
  exportData() {
    const code = exportCode();
    const shown = () => { UI.sheet = { kind: 'export', code }; render(); const t = document.getElementById('xfer'); if (t) t.select(); };
    try {
      navigator.clipboard.writeText(code).then(() => banner('Daten kopiert. Jetzt in der anderen App einfügen.', 'good', 2600), shown);
    } catch (e) { shown(); }
  },
  copyCode() {
    const t = document.getElementById('xfer');
    if (!t) return;
    t.select();
    try { navigator.clipboard.writeText(t.value).then(() => { UI.sheet = null; render(); banner('Code kopiert', 'good'); }, () => banner('Markiere den Code und kopiere ihn über das Menü.')); }
    catch (e) { banner('Markiere den Code und kopiere ihn über das Menü.'); }
  },
  importAsk() { UI.sheet = { kind: 'import' }; render(); },
  importData() {
    const t = document.getElementById('xfer');
    try {
      const n = importCode(t ? t.value : '');
      UI.sheet = null; render();
      banner(n ? `${plural(n, 'Eintrag', 'Einträge')} übernommen` : 'Alles war schon vorhanden', 'good', 2400);
    } catch (e) { banner('Der Code ist unvollständig. Kopiere ihn noch einmal vollständig.', 'bad', 2600); }
  },
};
function submitTotal(t) {
  const s = DB.current;
  if (!s) return;
  if (s.kind === 'x01') x01SubmitTotal(t);
  else if (s.kind === 'scoring') {
    if (!POSSIBLE_TOTALS.has(t)) { UI.entry = ''; banner(`${t} ist mit drei Darts nicht möglich. Bitte prüfe die Eingabe.`, 'bad', 2400); render(); return; }
    s.scores.push(t); UI.entry = '';
    if (t === 180) banner('180!', 'good', 1600);
    if (s.scores.length >= s.cfg.visits) { finishSession(); return; }
    save(); render();
  }
}
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a];
  if (fn) fn(el.dataset.v, el);
});
$app.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('tf') && el.dataset.pi !== undefined) { DB.settings.players[+el.dataset.pi].name = el.value; save(); }
});
$app.addEventListener('change', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.k) { setCfg(el.dataset.k, el.value); save(); render(); }
  else if (el.tagName === 'SELECT' && el.dataset.pi !== undefined) { DB.settings.players[+el.dataset.pi].bot = +el.value; save(); render(); }
  else if (el.classList.contains('switch') && el.dataset.k) { setCfg(el.dataset.k, el.checked); save(); setTimeout(render, 250); }
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('tf')) e.target.blur();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) { ACT.sheetx(); return; }
  if (UI.view !== 'play' || !DB.current || e.target.tagName === 'INPUT') return;
  const k = DB.current.kind;
  if ((k === 'x01' && DB.settings.inputMode === 'sum') || k === 'scoring') {
    if (/^\d$/.test(e.key)) ACT.key(e.key);
    else if (e.key === 'Backspace') ACT.keydel();
    else if (e.key === 'Enter') ACT.ok();
  }
});

// ================= Boot =================
function start(data) {
  load();
  if (data && data.view) { UI.view = data.view; UI.tab = data.tab || 'play'; UI.setup = data.setup || null; }
  else if (DB.current && DB.current.finished) UI.view = 'summary';
  if ((UI.view === 'play' || UI.view === 'summary') && !DB.current) UI.view = 'tabs';
  if (UI.view === 'setup' && !SETUP[UI.setup]) UI.view = 'tabs';
  if (!['tabs', 'setup', 'play', 'summary'].includes(UI.view)) UI.view = 'tabs';
  render();
  maybeBot();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ view: UI.view, tab: UI.tab, setup: UI.setup }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
